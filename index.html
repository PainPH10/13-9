<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pain Script - Mario Hub Style</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page: #7eb0d5; /* Màu nền xanh của game */
  --window-bg: #b2d6eb; /* Nền xanh nhạt của vùng chính */
  --sidebar-bg: #8b5a42; /* Màu nâu của sidebar */
  --sidebar-hover: #a36a4e;
  --text-dark: #2b2b2b;
  --text-light: #ffffff;
  --card-bg: #fcf8eb; /* Trắng ngà của card */
  --card-header-bg: #e8dfc8;
  --border-color: #3b3b3b;
  --accent-yellow: #ffca3a;
  --accent-red: #e63946;
  --accent-green: #5cb85c;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-hard: 4px 4px 0px rgba(0,0,0,0.2);
  --shadow-btn: 0 4px 0px #3b3b3b;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg-page);
  /* Tạo hiệu ứng nền lưới nhẹ */
  background-image: 
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  color: var(--text-dark);
  font-family: 'Fredoka', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

/* ===== KHUNG CỬA SỔ CHÍNH ===== */
.app-window {
  width: 100%;
  max-width: 1100px;
  background: var(--window-bg);
  border: 4px solid #5a7a92;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 90vh;
}

/* ===== THANH TIÊU ĐỀ TRÊN CÙNG ===== */
.top-bar {
  background: #6b8cae;
  border-bottom: 4px solid #5a7a92;
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-yellow);
  text-shadow: 2px 2px 0 #333, -1px -1px 0 #333, 1px -1px 0 #333, -1px 1px 0 #333, 1px 1px 0 #333;
  letter-spacing: 1px;
}

.status-area {
  display: flex;
  gap: 15px;
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  background: rgba(0,0,0,0.15);
  padding: 4px 12px;
  border-radius: 20px;
}

.window-controls { display: flex; gap: 8px; }
.win-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--border-color);
  display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer;
  box-shadow: var(--shadow-btn); transition: transform 0.1s;
}
.win-btn:active { transform: translateY(4px); box-shadow: none; }
.btn-min { background: var(--accent-yellow); color: var(--border-color); }
.btn-close { background: var(--accent-red); color: white; }

/* ===== KHU VỰC NỘI DUNG (SIDEBAR + MAIN) ===== */
.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* --- SIDEBAR (BÊN TRÁI) --- */
.sidebar {
  width: 260px;
  background: var(--sidebar-bg);
  padding: 20px 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  overflow-y: auto;
  border-right: 4px solid #5a3d2b;
}

.sidebar-title {
  color: #d1beb0;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 10px;
  margin-bottom: 5px;
}

/* Nút Menu trong Sidebar */
.side-btn {
  background: var(--card-bg);
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-dark);
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  transition: transform 0.1s, background 0.2s;
  width: 100%;
  text-align: left;
}
.side-btn:hover { background: #fff; }
.side-btn:active { transform: translateY(4px); box-shadow: none; }
.side-btn.on {
  background: #ffca3a; /* Màu vàng khi active */
  border-color: #d49f00;
  box-shadow: 0 4px 0 #d49f00;
}

/* Avatar & Profile */
.profile-area {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,0.2);
  padding: 10px;
  border-radius: var(--radius-md);
  margin-bottom: 10px;
}
.avatar-wrapper {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 3px solid var(--border-color);
  overflow: hidden;
  background: #fff;
  position: relative;
}
.avatar-img { width: 100%; height: 100%; object-fit: cover; }
.avatar-wrapper.playing { border-color: var(--accent-green); }
.profile-name { color: #fff; font-weight: 700; font-size: 16px; text-shadow: 1px 1px 0 #333; }

/* Audio Player */
.audio-player-card {
  background: #333;
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  box-shadow: var(--shadow-btn);
}
.audio-player-card:active { transform: translateY(4px); box-shadow: none; }
.play-icon-badge { background: var(--accent-green); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; }
.audio-info { flex: 1; display: flex; flex-direction: column; }
.audio-title { color: #fff; font-size: 12px; font-weight: 600; }
.audio-sub { color: #aaa; font-size: 10px; }
.equalizer { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq-bar { width: 3px; background: var(--accent-green); height: 4px; border-radius: 2px; }
.playing .eq-bar { animation: wave 0.8s infinite ease-in-out alternate; }
.playing .eq-bar:nth-child(2) { animation-delay: 0.2s; }
.playing .eq-bar:nth-child(3) { animation-delay: 0.4s; }
.playing .eq-bar:nth-child(4) { animation-delay: 0.1s; }
@keyframes wave { 0% { height: 4px; } 100% { height: 14px; } }

/* Social */
.social-row { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.social-btn {
  border: 3px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 8px;
  text-align: center;
  font-weight: 700;
  text-decoration: none;
  color: white;
  box-shadow: var(--shadow-btn);
  display: flex; justify-content: center; align-items: center; gap: 8px;
}
.social-btn:active { transform: translateY(4px); box-shadow: none; }
.yt-btn { background: #ff0000; }
.tt-btn { background: #000000; }

/* --- MAIN CONTENT (BÊN PHẢI) --- */
.main-content {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 15px;
}

.hero-title {
  font-size: 32px;
  font-weight: 700;
  margin: 0;
  color: #2b2b2b;
  text-shadow: 2px 2px 0 #fff;
}

/* Thanh tìm kiếm */
.search-box {
  background: var(--card-bg);
  border: 3px solid var(--border-color);
  border-radius: 30px;
  padding: 5px 5px 5px 15px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-hard);
  width: 300px;
}
.search-box input {
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 14px; width: 100%; color: var(--text-dark);
}
.search-box button {
  background: var(--accent-yellow); border: 2px solid var(--border-color);
  border-radius: 20px; padding: 6px 15px; font-family: inherit; font-weight: 700;
  cursor: pointer; box-shadow: 0 2px 0 var(--border-color);
}
.search-box button:active { transform: translateY(2px); box-shadow: none; }

/* Lưới Thẻ Script */
.grid-container {
  flex: 1;
  overflow-y: auto;
  padding-right: 5px;
}

/* Custom Scrollbar */
.grid-container::-webkit-scrollbar { width: 10px; }
.grid-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
.grid-container::-webkit-scrollbar-thumb { background: var(--sidebar-bg); border-radius: 10px; border: 2px solid var(--window-bg); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 15px;
  padding-bottom: 20px;
}

/* Card Style (Giống ảnh Auto Steal) */
.card {
  background: var(--card-bg);
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-hard);
  display: flex;
  flex-direction: column;
}

/* Phần Header của Card (Giống dòng chữ Auto Steal) */
.card-header {
  background: var(--card-header-bg);
  border-bottom: 3px solid var(--border-color);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 16px;
}
.card-header img { width: 20px; height: 20px; image-rendering: pixelated; }

.card-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-img-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #e0e0e0;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
  margin-bottom: 10px;
}
.card-img-box img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity 0.3s ease;
}
.card-img-box img.img-ready { opacity: 1; }
.card-img-placeholder {
  position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
  font-weight: 700; color: #888;
}

.game-name {
  font-size: 14px;
  font-weight: 600;
  color: #555;
  margin-bottom: 10px;
  line-height: 1.3;
}

.card-footer {
  margin-top: auto;
  display: flex;
  gap: 8px;
}
.btn-link {
  flex: 1;
  text-align: center;
  background: #fff;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-dark);
  text-decoration: none;
  font-weight: 700;
  font-size: 13px;
  padding: 8px 0;
  box-shadow: 0 3px 0 var(--border-color);
  transition: transform 0.1s;
}
.btn-link:active { transform: translateY(3px); box-shadow: none; }
.btn-sub { background: #f0f0f0; }

/* Phân trang */
.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 2px dashed rgba(0,0,0,0.1);
}
.pagination button {
  background: #fff; border: 2px solid var(--border-color);
  border-radius: var(--radius-sm); padding: 6px 12px;
  font-family: inherit; font-weight: 700; cursor: pointer;
  box-shadow: 0 3px 0 var(--border-color);
}
.pagination button.active { background: var(--accent-yellow); }
.pagination button:active { transform: translateY(3px); box-shadow: none; }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 var(--border-color); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .app-window { height: 100vh; border-radius: 0; border: none; }
  .app-body { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 4px solid #5a3d2b; flex-direction: row; flex-wrap: wrap; padding: 10px; }
  .sidebar-title { display: none; }
  .profile-area { width: 100%; justify-content: center; }
  .side-btn { width: calc(50% - 5px); margin-bottom: 5px; padding: 8px; font-size: 13px; }
  .social-row { flex-direction: row; width: 100%; }
  .audio-player-card { width: 100%; }
  .main-header { flex-direction: column; align-items: flex-start; }
  .search-box { width: 100%; }
  .grid { grid-template-columns: 1fr; }
}
</style>

<script>
/* ============ Audio Logic ============ */
const audio = document.getElementById('bgAudio');
const avatarFrame = document.getElementById('avatarFrame');
const playerWidget = document.getElementById('playerWidget');
const audioStatus = document.getElementById('audioStatus');
const iconBadge = document.getElementById('iconBadge');
let isPlaying = false;

function activateAudioUI() {
  isPlaying = true;
  avatarFrame.classList.add('playing');
  playerWidget.classList.add('playing');
  iconBadge.innerText = '♫';
  audioStatus.innerText = 'Đang phát...';
}
function tryAutoplay() {
  audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); })
    .catch(() => { audioStatus.innerText = 'Chạm để nghe'; });
}
function unlockAndPlay() {
  if (!isPlaying) {
    audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); }).catch(() => {});
  }
}
function manualPlayTrigger() {
  if (audio.paused) { audio.play().then(activateAudioUI).catch(()=>{}); }
}
function removeInteractionListeners() {
  ['pointerdown','touchstart','click','scroll'].forEach(evt => document.removeEventListener(evt, unlockAndPlay));
}
['pointerdown','touchstart','click','scroll'].forEach(evt => {
  document.addEventListener(evt, unlockAndPlay, { passive: true });
});
window.addEventListener('DOMContentLoaded', tryAutoplay);

  if (!m) return url;
  const [, user, repo, branch, path] = m;
  return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
shuffle(SCRIPTS);

const $ = id => document.getElementById(id);
let cat = 'Tất Cả';
let currentPage = 1;
const ITEMS_PER_PAGE = 20;
const cats = ['Tất Cả', 'Steal An Egg', 'Tất Cả Script Khủng Long'];

/* ============ Hình ảnh tải chậm ============ */
let imgObserver;
if (typeof IntersectionObserver !== 'undefined') {
  imgObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => { img.classList.add('img-ready'); };
      }
      imgObserver.unobserve(img);
    }
  }, { rootMargin: '600px 0px', threshold: 0.01 });
} else {
  imgObserver = { observe: (img) => { if (img.dataset.src && !img.src) { img.src = img.dataset.src; img.onload = () => img.classList.add('img-ready'); } }, unobserve: () => {} };
}

function primeFirstImages(count = 6) {
  const imgs = [...document.querySelectorAll('.card-img-box img[data-src]')].slice(0, count);
  imgs.forEach(img => {
    const url = img.dataset.src;
    if (!url) return;
    img.src = url;
    img.onload = () => img.classList.add('img-ready');
    imgObserver.unobserve(img);
  });
}

/* ============ Render ============ */
function render(){
  const q = $('q').value.trim().toLowerCase();

  const filtered = SCRIPTS.filter(s =>
    (cat === 'Tất Cả' || s.c === cat) &&
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);

  // Render nút Categories ở Sidebar
  $('sidebar-tags').innerHTML = cats.map((c) => `
    <button class="side-btn ${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      ${c}
    </button>
  `).join('');

  // Render Cards
  $('list').innerHTML = paginated.map(s => `
    <div class="card">
      <div class="card-header">
        <span style="font-size: 18px;">⭐</span> ${s.hub}
      </div>
      <div class="card-body">
        <div class="card-img-box">
          ${s.img
            ? `<img data-src="${fastCDN(s.img)}" alt="${s.hub}" decoding="async">`
            : `<div class="card-img-placeholder">NO IMAGE</div>`}
        </div>
        <div class="game-name">
          ${s.game ? `Game: ${s.game}` : 'Script Tổng Hợp'}
        </div>
        <div class="card-footer">
          <a class="btn-link" href="${s.link}" target="_blank" rel="noopener">LINK CHÍNH</a>
          <a class="btn-link btn-sub" href="${s.subLink}" target="_blank" rel="noopener">LINK PHỤ</a>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.card-img-box img[data-src]').forEach(img => imgObserver.observe(img));
  primeFirstImages(6);

  let pageButtons = '';
  if (totalPages > 1) {
    pageButtons += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Trước</button>`;
    // Chỉ hiện tối đa 5 trang để không bị vỡ layout
    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

    for (let p = startPage; p <= endPage; p++) {
      pageButtons += `<button class="${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
    }
    pageButtons += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Sau</button>`;
  }
  $('pagination').innerHTML = pageButtons;
}

function changeCat(c) { cat = c; currentPage = 1; render(); }
function changePage(p) { currentPage = p; render(); document.querySelector('.grid-container').scrollTo({ top: 0, behavior: 'smooth' }); }

$('q').addEventListener('input', () => {
  if ($('q').value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
});
$('go').addEventListener('click', () => {
  if ($('q').value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
});

render();
</script>
