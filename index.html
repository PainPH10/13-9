<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pain Script</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(180deg, #0a1128 0%, #1c2541 50%, #0a1128 100%);
  --blue-bright: #3a86ff;
  --blue-glow: #00b4d8;
  --card-bg: rgba(255, 255, 255, 0.05);
  --text-main: #ffffff;
  --text-sub: #94a3b8;
  --radius: 18px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-gradient) fixed;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

/* Header & Avatar Container */
.header-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px 10px 20px;
}

/* Glowing Circular Avatar Frame */
.avatar-wrapper {
  position: relative;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #3a86ff, #00b4d8);
  box-shadow: 0 0 35px rgba(58, 134, 255, 0.6), 0 0 15px rgba(0, 180, 216, 0.4);
  padding: 4px;
  margin-bottom: 12px;
}

.avatar-wrapper::after {
  content: '';
  position: absolute;
  top: -6px; left: -6px; right: -6px; bottom: -6px;
  border-radius: 50%;
  border: 2px solid rgba(58, 134, 255, 0.5);
  box-shadow: 0 0 20px rgba(0, 180, 216, 0.4);
}

.avatar-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.profile-name {
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

/* Combined YouTube & Stats Section */
.stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 10px 20px;
  margin: 0 auto 25px auto;
  max-width: 360px;
  width: 100%;
}

.stat-item {
  text-align: left;
}
.stat-value {
  font-size: 20px;
  font-weight: 800;
  color: #ffffff;
}
.stat-label {
  font-size: 11px;
  color: var(--text-sub);
  font-weight: 600;
}

/* YouTube Action Button Inside Stats */
.yt-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, #ff0000, #cc0000);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 12px;
  padding: 8px 16px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  white-space: nowrap;
}
.yt-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
}

/* Hero Section */
main {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 16px;
}
.hero-title {
  text-align: center;
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(58, 134, 255, 0.4);
  margin: 4px 0;
  letter-spacing: -0.5px;
}
.hero-sub {
  text-align: center;
  color: #90e0ef;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
}

/* Search Box */
.search-box {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 30px;
  padding: 6px 6px 6px 18px;
  display: flex;
  align-items: center;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  margin-bottom: 20px;
}
.search-box input {
  border: none;
  outline: none;
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  color: var(--text-main);
  background: transparent;
}
.search-box input::placeholder {
  color: #64748b;
}
.search-box button {
  background: linear-gradient(135deg, #3a86ff, #00b4d8);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

/* Tags Wrap */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.tags button {
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 8px 14px;
  border-radius: 25px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tags button.on {
  background: #3a86ff;
  color: #ffffff;
}
.tags button span.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

/* Grid Script Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
}
.card-img-box {
  width: 100%;
  height: 110px;
  background: linear-gradient(135deg, #3a86ff, #00b4d8);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-img-placeholder {
  color: white;
  font-weight: 800;
  font-size: 14px;
  text-align: center;
  padding: 10px;
}
.card-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.card-title {
  font-size: 13px;
  font-weight: 800;
  margin: 0 0 8px 0;
  color: #ffffff;
  line-height: 1.3;
}
.game-name {
  color: #00b4d8;
  font-weight: 700;
}

.card-footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.btn-link {
  color: #90e0ef;
  text-decoration: none;
  font-weight: 700;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.click-count {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
}
</style>
</head>
<body>

<!-- Hidden Audio Player for Automatic Background Playback -->
<audio id="bgAudio" loop autoplay>
  <source src="./nhac.mp3" type="audio/mpeg">
</audio>

<div class="header-container">

  <div class="stats-bar">
    <div class="stat-item">

    </div>
    <a class="yt-btn" href="https://youtube.com/@painph09?si=s4Q14SsJCMgld2NT" target="_blank">
      ▶ YOUTUBE
    </a>

<main>

const audio = document.getElementById('bgAudio');
function attemptAutoplay() {
  audio.play().catch(() => {
    // If browser blocks autoplay, play audio on first user touch/click
    const playOnInteraction = () => {
      audio.play();
      document.removeEventListener('click', playOnInteraction);
      document.removeEventListener('touchstart', playOnInteraction);
    };
    document.addEventListener('click', playOnInteraction);
    document.addEventListener('touchstart', playOnInteraction);
  });
}
attemptAutoplay();

];

function getStoredClicks() {
  return JSON.parse(localStorage.getItem('pain_script_clicks') || '{}');
}

function registerClick(id) {
  const stored = getStoredClicks();
  stored[id] = (stored[id] || 0) + 1;
  localStorage.setItem('pain_script_clicks', JSON.stringify(stored));
  updateStats();
  render();
}

function updateStats() {
  const stored = getStoredClicks();
  const total = Object.values(stored).reduce((a, b) => a + b, 0);
  document.getElementById('totalClicks').innerText = total;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
shuffle(SCRIPTS);

const colors = ['#3a86ff', '#00b4d8', '#48cae4', '#90e0ef', '#0077b6'];
const $=id=>document.getElementById(id);
let cat='Tất Cả';
const cats=['Tất Cả', 'Steal An Egg', 'Ride A Pet', 'Tất Cả Script Khủng Long'];

function render(){
  const q = $('q').value.trim().toLowerCase();
  const storedClicks = getStoredClicks();
  
  const filtered = SCRIPTS.filter(s => 
    (cat === 'Tất Cả' || s.c === cat) && 
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      <span class="dot" style="background:${colors[i % colors.length]}"></span>
      ${c}
    </button>
  `).join('');

  $('list').innerHTML = filtered.map(s => {
    const count = storedClicks[s.id] || 0;
    return `
    <div class="card">
      <div class="card-img-box">
        ${s.img ? `<img src="${s.img}" alt="${s.hub}">` : `<div class="card-img-placeholder">SCRIPT ${s.c.toUpperCase()}</div>`}
      </div>
      <div class="card-body">
        <h2 class="card-title">
          ${s.hub} ${s.game ? `<span class="game-name">${s.game}</span>` : ''}
        </h2>
        <div class="card-footer">
          <a class="btn-link" href="${s.link}" target="_blank" onclick="registerClick(${s.id})">LẤY SCRIPT &rarr;</a>
          <span class="click-count">👁️ ${count}</span>
        </div>
      </div>
    </div>
  `}).join('');
}

function changeCat(c) {
  cat = c;
  render();
}

$('q').addEventListener('input', render);$('go').addEventListener('click', render);

updateStats();
render();
</script>
</body>
</html>
