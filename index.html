<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pain Script — Luxury Hub</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08060a;
  --bg-2: #0d0a10;
  --surface: #14101a;
  --surface-2: #1b1522;
  --surface-3: #241c30;
  --gold: #d4af37;
  --gold-light: #f0d78c;
  --gold-bright: #ffd966;
  --gold-deep: #a8862c;
  --cream: #f5ecd8;
  --text: #f8f0e0;
  --text-sub: #c4b59a;
  --text-dim: #75664c;
  --border: rgba(212, 175, 55, 0.16);
  --border-med: rgba(212, 175, 55, 0.32);
  --border-strong: rgba(212, 175, 55, 0.55);
  --shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.95);
  --shadow-gold: 0 0 60px -10px rgba(212, 175, 55, 0.3);
  --radius: 20px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; }
html { color-scheme: dark; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
  padding-bottom: 0;
}

/* ===== Ambient background ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(1100px 600px at 12% -5%, rgba(212, 175, 55, 0.13), transparent 60%),
    radial-gradient(900px 500px at 92% 10%, rgba(212, 175, 55, 0.08), transparent 60%),
    radial-gradient(1000px 700px at 50% 105%, rgba(180, 140, 60, 0.10), transparent 65%),
    linear-gradient(180deg, #0a0806 0%, #08060a 45%, #050408 100%);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

main, .hero-banner, footer { position: relative; z-index: 1; }

/* ===== HERO BANNER ===== */
.hero-banner {
  position: relative;
  padding: 44px 24px 30px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: linear-gradient(180deg, rgba(212, 175, 55, 0.04) 0%, transparent 100%);
}

.hero-banner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
  opacity: 0.5;
}

.hero-inner {
  max-width: 1320px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
}

@media (min-width: 860px) {
  .hero-inner {
    flex-direction: row;
    align-items: center;
    gap: 40px;
    text-align: left;
  }
}

/* Avatar */
.avatar-wrap {
  position: relative;
  flex-shrink: 0;
  width: 160px;
  height: 160px;
}

@media (min-width: 860px) {
  .avatar-wrap { width: 190px; height: 190px; }
}

.avatar-ring {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--gold-bright), var(--gold-deep), var(--gold-light), var(--gold-bright));
  animation: spin 10s linear infinite;
  filter: blur(0.5px);
  opacity: 0.85;
}

.avatar-ring::after {
  content: '';
  position: absolute;
  inset: 5px;
  background: var(--bg);
  border-radius: 50%;
}

@keyframes spin { to { transform: rotate(360deg); } }

.avatar-inner {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid var(--bg);
  box-shadow:
    0 0 50px rgba(212, 175, 55, 0.45),
    0 0 100px rgba(212, 175, 55, 0.2),
    inset 0 0 30px rgba(0,0,0,0.5);
}

.avatar-inner img {
  width: 100%; height: 100%;
  object-fit: cover;
  animation: spinReverse 10s linear infinite;
}

@keyframes spinReverse { to { transform: rotate(-360deg); } }

.avatar-wrap.playing .avatar-ring {
  animation-duration: 4s;
  box-shadow: 0 0 90px rgba(255, 217, 102, 0.7);
}

/* Hero info */
.hero-info {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

@media (min-width: 860px) {
  .hero-info {
    text-align: left;
    align-items: flex-start;
  }
}

.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--gold-light);
  text-transform: uppercase;
  padding: 0;
}

.hero-kicker::before,
.hero-kicker::after {
  content: '';
  width: 30px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.hero-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(36px, 6vw, 62px);
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.02;
  margin: 0;
  background: linear-gradient(135deg, #ffffff 0%, var(--gold-bright) 40%, var(--gold) 70%, #ffffff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 6s linear infinite;
  filter: drop-shadow(0 4px 30px rgba(212, 175, 55, 0.35));
}

@keyframes shine { to { background-position: 200% center; } }

.hero-tagline {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 15px;
  color: var(--text-sub);
  margin: 0;
  letter-spacing: 0.3px;
 : line-height: 1.6;
}

/* Audio  + Social row */
.hero-actions {
1  display: flex;
  flex-wrap: wrap;
 px gap: 12px;
  justify-content: center;
  solid width: 100%;
  max-width: 540px;
 var  margin-top: 6px;
}

@media (min-width: 860px) {
  .hero-actions { justify-content: flex-start; }
}

.audio-player-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, rgba(30, 24, 40, 0.9), rgba(20, 16, 26, 0.9));
  backdrop-filter: blur(20px);
  border(--border-med);
  border-radius: 100px;
  padding: 8px 20px 8px 8px;
  cursor: pointer;
  user-select: none;
  flex: 1 1 260px;
  min-width: 0;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  box-shadow: var(--shadow);
}

.audio-player-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow), var(--shadow-gold);
}

.play-badge {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
  color: #1a1206;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 0 24px rgba(212, 175, 55, 0.6), inset 0 1px 0 rgba(255,255,255,0.4);
}

.audio-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.audio-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.audio-sub {
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 600;
  margin-top: 1px;
}

.equalizer { display: flex; align-items: flex-end; gap: 2.5px; height: 18px; flex-shrink: 0; }
.eq-bar { width: 2.5px; background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep)); border-radius: 2px; height: 4px; }
.playing .eq-bar { animation: wave 0.85s infinite ease-in-out alternate; }
.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
.playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }
@keyframes wave { 0% { height: 4px; } 100% { height: 18px; } }

.social-row {
  display: flex;
  gap: 10px;
  flex: 1 1 220px;
}

.social-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  font-size: 11.5px;
  letter-spacing: 0.8px;
  padding: 13px 18px;
  border-radius: 100px;
  flex: 1;
  border: 1px solid var(--border-med);
  background: rgba(20, 16, 26, 0.8);
  transition: all 0.22s ease;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.social-btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  color: var(--gold-bright);
  box-shadow: var(--shadow), var(--shadow-gold);
}

.social-btn.yt svg { color: #ff2d55; }
.social-btn.tt svg { color: var(--gold-bright); }

/* ===== STATS BENTO ===== */
.stats-bento {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 24px;
  margin-top: 34px;
}

.stat-card {
  position: relative;
  padding: 22px 20px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(24, 18, 32, 0.85), rgba(16, 12, 22, 0.85));
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  overflow: hidden;
  text-align: center;
  transition: all 0.25s ease;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
  opacity: 0.6;
}

.stat-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-med);
  box-shadow: var(--shadow), var(--shadow-gold);
}

.stat-value {
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1;
  display: block;
  margin-bottom: 6px;
}

.stat-label {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
}

/* ===== MAIN ===== */
main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 50px 24px 80px;
}

/* ===== SEARCH ===== */
.search-section {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 40px;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
  background: linear-gradient(135deg, rgba(24, 18, 32, 0.95), rgba(16, 12, 22, 0.95));
  border: 1px solid var(--border-med);
  border-radius: 18px;
  padding: 8px 8px 8px 22px;
  transition: all 0.3s ease;
  box-shadow: var(--shadow);
}

.search-box:focus-within {
  border-color: var(--gold);
  box-shadow: var(--shadow), 0 0 0 4px rgba(212, 175, 55, 0.1), 0 0 50px rgba(212, 175, 55, 0.15);
}

.search-icon {
  color: var(--gold);
  flex-shrink: 0;
  margin-right: 12px;
  opacity: 0.85;
}

.search-box input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  padding: 10px 0;
}

.search-box input::placeholder { color: var(--text-dim); font-weight: 500; }

.search-box button {
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
  border: none;
  color: #1a1206;
  padding: 13px 32px;
  border-radius: 12px;
  font-family: inherit;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.8px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}

.search-box button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 28px rgba(212, 175, 55, 0.6), inset 0 1px 0 rgba(255,255,255,0.5);
}

/* ===== TAGS ===== */
.tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.tags button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: rgba(20, 16, 26, 0.7);
  color: var(--text-sub);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: all 0.22s ease;
  white-space: nowrap;
}

.tags button:hover {
  border-color: var(--border-med);
  color: var(--text);
  transform: translateY(-1px);
}

.tags button.on {
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
  color: #1a1206;
  border-color: transparent;
  box-shadow: 0 6px 24px rgba(212, 175, 55, 0.45), inset 0 1px 0 rgba(255,255,255,0.35);
  font-weight: 800;
}

.tags button .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.6);
}

/* ===== SECTION HEADER ===== */
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.section-kicker {
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3.5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 8px;
  opacity: 0.9;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 800;
  margin: 0;
  color: var(--text);
  letter-spacing: -0.8px;
  line-height: 1;
}

.section-count {
  font-size: 11px;
  font-weight: 800;
  color: var(--gold-light);
  padding: 8px 16px;
  border-radius: 100px;
  background: rgba(212, 175, 55, 0.08);
  border: 1px solid var(--border-med);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 720px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }
}

/* ===== CARD ===== */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: linear-gradient(160deg, #16111d 0%, #0e0a13 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow);
}

@media (min-width: 720px) {
  .card {
    flex-direction: row;
    min-height: 180px;
  }
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
  opacity: 0.4;
  transition: opacity 0.3s ease;
  z-index: 3;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-5px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow), var(--shadow-gold);
}

.card:hover::before { opacity: 1; }

/* Image box */
.card-img-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: linear-gradient(135deg, #1e1622, #14101a);
  overflow: hidden;
  flex-shrink: 0;
}

@media (min-width: 720px) {
  .card-img-box {
    width: 240px;
    aspect-ratio: auto;
    min-height: 180px;
  }
}

.card-img-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #1a1224 25%, #2a1a35 50%, #1a1224 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  z-index: 1;
  transition: opacity 0.4s ease;
}

.card-img-box.loaded::before { opacity: 0; pointer-events: none; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.card-img-box::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.5) 100%);
  z-index: 2;
  pointer-events: none;
}

@media (min-width: 720px) {
  .card-img-box::after {
    background: linear-gradient(90deg, transparent 0%, transparent 60%, rgba(10, 8, 14, 0.9) 100%);
  }
}

.card-img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  z-index: 1;
}

.card-img-box img.img-ready { opacity: 1; }
.card:hover .card-img-box img { transform: scale(1.06); }

.card-img-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 16px;
  color: var(--gold);
  text-align: center;
  padding: 0 20px;
  z-index: 2;
  text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
}

/* Card body */
.card-body {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
  flex: 1;
  min-width: 0;
}

.card-eyebrow {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 2.5px;
  color: var(--gold);
  text-transform: uppercase;
  margin: 0 0 6px 0;
  opacity: 0.85;
}

.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  margin: 0;
  color: var(--text);
  line-height: 1.25;
  letter-spacing: -0.2px;
  word-wrap: break-word;
}

.game-name {
  display: inline-block;
  margin-top: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--gold-light);
  padding: 4px 10px;
  border-radius: 6px;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid var(--border-med);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

/* Card footer */
.card-footer {
  display: flex;
  gap: 8px;
  margin-top: auto;
}

.btn-link {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 11px 10px;
  border-radius: 10px;
  border: 1px solid var(--border-med);
  color: var(--text);
  background: rgba(255,255,255,0.02);
  transition: all 0.22s ease;
  white-space: nowrap;
}

.btn-link:hover {
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
  border-color: transparent;
  color: #1a1206;
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
  transform: translateY(-1px);
}

.btn-link.btn-sub {
  color: var(--gold-light);
  background: rgba(212, 175, 55, 0.06);
}

.btn-link.btn-sub:hover {
  background: linear-gradient(135deg, #fff3c4, var(--gold));
  color: #1a1206;
}

/* ===== PAGINATION ===== */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 60px;
  flex-wrap: wrap;
}

.pagination button {
  min-width: 44px;
  height: 44px;
  padding: 0 18px;
  border-radius: 12px;
  background: rgba(20, 16, 26, 0.85);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.22s ease;
}

.pagination button:hover:not(:disabled) {
  border-color: var(--border-med);
  color: var(--gold-bright);
  transform: translateY(-2px);

const playerWidget = document.getElementById('playerWidget');
const audioStatus = document.getElementById('audioStatus');
const iconBadge = document.getElementById('iconBadge');
let isPlaying = false;

function activateAudioUI() {
  isPlaying = true;
  avatarFrame.classList.add('playing');
  playerWidget.classList.add('playing');
  iconBadge.innerText = '♫';
  audioStatus.innerText = 'Đang phát liên tục';
}
function tryAutoplay() {
  audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); })
    .catch(() => { audioStatus.innerText = 'Chạm để bật nhạc'; });
}
function unlockAndPlay() {
  if (!isPlaying) {
    audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); })
      .catch(() => {});
  }
}
function manualPlayTrigger() {
  if (audio.paused) { audio.play().then(activateAudioUI).catch(()=>{}); }
}
function removeInteractionListeners() {
  ['pointerdown','touchstart','click','scroll'].forEach(evt => document.removeEventListener(evt, unlockAndPlay));
}
['pointerdown','touchstart','click','scroll'].forEach(evt => {
  document.addEventListener(evt, unlockAndPlay, { passive: true });
});
window.addEventListener('DOMContentLoaded', tryAutoplay);

  if (!url) return url;
  const m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
  if (!m) return url;
  const [, user, repo, branch, path] = m;
  return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
shuffle(SCRIPTS);

const dotColors = ['#ffd966', '#d4af37', '#c4b59a'];
const $ = id => document.getElementById(id);
let cat = 'Tất Cả';
let currentPage = 1;
const ITEMS_PER_PAGE = 20;
const cats = ['Tất Cả', 'Steal An Egg', 'Tất Cả Script Khủng Long'];

const statScripts = $('statScripts');
if (statScripts) statScripts.textContent = SCRIPTS.length;

/* ============ Image lazy load ============ */
let imgObserver;
if (typeof IntersectionObserver !== 'undefined') {
  imgObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
      imgObserver.unobserve(img);
    }
  }, { rootMargin: '600px 0px', threshold: 0.01 });
} else {
  imgObserver = {
    observe: (img) => {
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
    },
    unobserve: () => {}
  };
}

function primeFirstImages(count = 8) {
  const imgs = [...document.querySelectorAll('.card-img-box img[data-src]')].slice(0, count);
  imgs.forEach(img => {
    const url = img.dataset.src;
    if (!url) return;
    img.src = url;
    img.onload = () => {
      img.classList.add('img-ready');
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    img.onerror = () => {
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    imgObserver.unobserve(img);
  });
}

/* ============ Render ============ */
function render(){
  const q = $('q').value.trim().toLowerCase();

  const filtered = SCRIPTS.filter(s =>
    (cat === 'Tất Cả' || s.c === cat) &&
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);

  $('resultCount').textContent = filtered.length + ' kết quả';
  $('sectionTitle').textContent = cat === 'Tất Cả' ? 'Tất Cả Script' : cat;

  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      <span class="dot" style="background:${dotColors[i % dotColors.length]}"></span>
      <span>${c}</span>
    </button>
  `).join('');

  $('list').innerHTML = paginated.map(s => `
    <div class="card">
      <div class="card-img-box">
        ${s.img
          ? `<img data-src="${fastCDN(s.img)}" alt="${s.hub}" decoding="async" width="640" height="400">`
          : `<div class="card-img-placeholder">${s.c}</div>`}
      </div>
      <div class="card-body">
        <div>
          <p class="card-eyebrow">Script Hub</p>
          <h2 class="card-title">${s.hub}${s.game ? `<br><span class="game-name">${s.game}</span>` : ''}</h2>
        </div>
        <div class="card-footer">
          <a class="btn-link" href="${s.link}" target="_blank" rel="noopener">LINK CHÍNH</a>
          <a class="btn-link btn-sub" href="${s.subLink}" target="_blank" rel="noopener">LINK PHỤ</a>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.card-img-box img[data-src]').forEach(img => imgObserver.observe(img));
  primeFirstImages(8);

  let pageButtons = '';
  if (totalPages > 1) {
    pageButtons += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">&larr;</button>`;
    for (let p = 1; p <= totalPages; p++) {
      pageButtons += `<button class="${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
    }
    pageButtons += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">&rarr;</button>`;
  }
  $('pagination').innerHTML = pageButtons;
}

function changeCat(c) { cat = c; currentPage = 1; render(); }
function changePage(p) { currentPage = p; render(); window.scrollTo({ top: 400, behavior: 'smooth' }); }

$('q').addEventListener('input', () => {
  if ($('q').value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
});
$('go').addEventListener('click', () => {
  if ($('q').value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
});

render();
</script>
</body>
</html>
