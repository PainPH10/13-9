<style>
:root {
  /* Bảng màu dựa trên ảnh */
  --bg-sky: #72a8d4;
  --bg-grass: #5c9e3d;
  --window-border: #3a2b23;
  --window-bg: #a3c6e2;
  --sidebar-bg: #8c5b49;
  --sidebar-hover: #6e4638;
  --panel-bg: #fdf4df;
  --panel-border: #3a2b23;
  --text-dark: #3a2b23;
  --text-light: #ffffff;
  
  --btn-yellow: #fcd353;
  --btn-red: #f04e44;
  --btn-green: #5cb85c;
  --btn-white: #ffffff;
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  
  /* Hiệu ứng đổ bóng cứng (Hard Shadow) đặc trưng của game */
  --shadow-hard: 4px 4px 0 var(--panel-border);
  --shadow-soft: 0 8px 0 rgba(0,0,0,0.15);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  /* Nền trời xanh và cỏ xanh phía dưới */
  background: linear-gradient(to bottom, var(--bg-sky) 0%, var(--bg-sky) 75%, var(--bg-grass) 75%, var(--bg-grass) 100%);
  background-attachment: fixed;
  color: var(--text-dark);
  font-family: 'Fredoka', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

/* ================= KHUNG CỬA SỔ CHÍNH ================= */
.window-frame {
  max-width: 1000px;
  margin: 20px auto;
  background: var(--window-bg);
  border: 4px solid var(--window-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 0 4px #b8d5eb;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* ================= THANH TOP BAR (Header) ================= */
.top-bar {
  background: var(--window-bg);
  padding: 12px 20px;
  border-bottom: 4px solid var(--window-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar-wrapper {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 12px;
  border: 3px solid var(--window-border);
  background: var(--btn-yellow);
  overflow: hidden;
  box-shadow: 2px 2px 0 var(--window-border);
}

.avatar-wrapper.playing { animation: bounce 1s infinite alternate; }
@keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

.avatar-img { width: 100%; height: 100%; object-fit: cover; }

.profile-name {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-dark);
  text-shadow: 1px 1px 0 #fff;
  letter-spacing: 0.5px;
  -webkit-text-stroke: 1px var(--window-border);
}

/* Nút chỉnh âm thanh */
.audio-player-card {
  display: flex;
  align-items: center;
  background: var(--panel-bg);
  border: 3px solid var(--window-border);
  border-radius: 20px;
  padding: 4px 12px;
  box-shadow: var(--shadow-hard);
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s;
}
.audio-player-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--panel-border); }

.play-icon-badge {
  background: var(--btn-green);
  border: 2px solid var(--window-border);
  width: 28px; height: 28px;
  border-radius: 50%;
  color: white;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-right: 8px;
}

.audio-info { display: flex; flex-direction: column; }
.audio-title { font-size: 12px; font-weight: 700; color: var(--text-dark); }
.audio-sub { font-size: 10px; color: #6b5b53; }

.equalizer { display: flex; align-items: flex-end; gap: 3px; height: 16px; margin-left: 10px; }
.eq-bar { width: 3px; background: var(--window-border); border-radius: 3px; height: 4px; }
.playing .eq-bar { animation: wave 0.8s infinite ease-in-out alternate; }
.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
.playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }
@keyframes wave { 0% { height: 4px; } 100% { height: 16px; } }

/* Nút MXH */
.social-row { display: flex; gap: 10px; }
.yt-btn, .tt-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--text-dark); text-decoration: none; font-weight: 700; font-size: 12px;
  padding: 6px 14px; border-radius: 12px; border: 3px solid var(--window-border);
  box-shadow: var(--shadow-hard); transition: transform 0.1s;
}
.yt-btn:active, .tt-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--panel-border); }
.yt-btn { background: var(--btn-red); color: white; }
.tt-btn { background: var(--btn-white); }

/* ================= KHU VỰC CHÍNH (Main Layout) ================= */
.main-layout {
  display: flex;
  flex-direction: row;
  min-height: 600px;
}

/* Sidebar bên trái */
.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  border-right: 4px solid var(--window-border);
  padding: 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-title {
  color: #d1b5a9; font-size: 12px; font-weight: 700; margin: 10px 0 5px 8px; text-transform: uppercase;
}

.tags {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tags button {
  background: transparent;
  border: none;
  padding: 10px 12px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: #e4cbc2;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  transition: all 0.2s;
}
.tags button:hover { background: rgba(0,0,0,0.1); color: white; }
.tags button.on {
  background: var(--btn-yellow);
  color: var(--text-dark);
  border: 3px solid var(--window-border);
  box-shadow: 2px 2px 0 var(--window-border);
}
.tags button span.dot { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--window-border); }

/* Khu vực nội dung bên phải */
.content-area {
  flex: 1;
  background: var(--panel-bg);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

/* Thanh công cụ (Search + Title) */
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 15px;
  flex-wrap: wrap;
}

.hero-title {
  font-size: 28px;
  font-weight: 700;
  margin: 0;
  color: var(--text-dark);
  text-transform: uppercase;
}

.search-box {
  background: var(--btn-white);
  border: 3px solid var(--window-border);
  border-radius: 12px;
  padding: 4px 4px 4px 15px;
  display: flex;
  align-items: center;
  box-shadow: var(--shadow-hard);
  width: 100%;
  max-width: 400px;
}
.search-box input { border: none; outline: none; width: 100%; font-family: inherit; font-size: 14px; color: var(--text-dark); background: transparent; }
.search-box button {
  background: var(--btn-yellow); border: 2px solid var(--window-border); color: var(--text-dark);
  padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
  transition: transform 0.1s;
}
.search-box button:active { transform: scale(0.95); }

/* ================= LƯỚI THẺ (Cards) ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.card {
  background: var(--panel-bg);
  border: 3px solid var(--window-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-hard);
  display: flex;
  flex-direction: column;
  transition: transform 0.1s;
}
.card:hover { transform: translateY(-2px); }

/* Thẻ tiêu đề giống trong ảnh */
.card-header-title {
  background: #ebe2cd;
  padding: 8px 12px;
  border-bottom: 3px solid var(--window-border);
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-img-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #dcd4c1;
  position: relative;
  border-bottom: 3px solid var(--window-border);
  display: flex; align-items: center; justify-content: center;
}

.card-img-box::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, #dcd4c1 25%, #ece5d4 50%, #dcd4c1 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; z-index: 1; transition: opacity .35s ease;
}
.card-img-box.loaded::before { opacity: 0; pointer-events: none; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.card-img-box img {
  width: 100%; height: 100%; object-fit: cover; object-position: top center;
  opacity: 0; transition: opacity .35s ease; position: relative; z-index: 2;
}
.card-img-box img.img-ready { opacity: 1; }
.card-img-placeholder { color: #a89f8d; font-weight: 700; z-index: 2; }

.card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }

.card-title {
  font-size: 16px; font-weight: 700; margin: 0 0 12px 0; color: var(--text-dark); line-height: 1.3;
}
.game-name { display: block; font-size: 13px; color: #7a695e; margin-top: 4px; }

.card-footer {
  margin-top: auto; display: flex; gap: 10px;
}

/* Nút bấm trong Card (Giống nút bật/tắt trong ảnh) */
.btn-link {
  flex: 1; text-align: center; background: var(--btn-white); border: 3px solid var(--window-border);
  color: var(--text-dark); text-decoration: none; font-weight: 700; font-size: 13px; padding: 8px 0;
  border-radius: 8px; box-shadow: 2px 2px 0 var(--window-border); transition: transform 0.1s;
  display: flex; justify-content: center; align-items: center; gap: 5px;
}
.btn-link:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--window-border); }
.btn-link:hover { background: #f0f0f0; }

.btn-sub { background: #e8f4e8; color: #2e7d32; }
.btn-sub:hover { background: #d4ecd4; }

/* ================= PHÂN TRANG ================= */
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pagination button {
  background: var(--btn-white); border: 3px solid var(--window-border); padding: 8px 16px; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text-dark); cursor: pointer;
  box-shadow: 2px 2px 0 var(--window-border); transition: all 0.1s;
}
.pagination button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0; }
.pagination button.active { background: var(--btn-yellow); }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Responsive */
@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 4px solid var(--window-border); padding: 10px; flex-direction: row; overflow-x: auto; }
  .sidebar-title { display: none; }
  .tags { flex-direction: row; }
  .tags button { white-space: nowrap; }
  .grid { grid-template-columns: 1fr; }
  .top-bar { flex-direction: column; align-items: stretch; }
  .brand-area { justify-content: center; }
  .search-box { max-width: 100%; }
}
</style>

<script>
/* ============ Audio Logic ============ */
const audio = document.getElementById('bgAudio');
const avatarFrame = document.getElementById('avatarFrame');
const playerWidget = document.getElementById('playerWidget');
const audioStatus = document.getElementById('audioStatus');
const iconBadge = document.getElementById('iconBadge');
let isPlaying = false;

function activateAudioUI() {
  isPlaying = true;
  avatarFrame.classList.add('playing');
  playerWidget.classList.add('playing');
  iconBadge.innerText = '♫';
  audioStatus.innerText = 'Đang phát...';
}
function tryAutoplay() {
  audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); })
    .catch(() => { audioStatus.innerText = 'Chạm để nghe'; });
}
function unlockAndPlay() {
  if (!isPlaying) {
    audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); })
      .catch(() => {});
  }
}
function manualPlayTrigger() {
  if (audio.paused) { audio.play().then(activateAudioUI).catch(()=>{}); }
}
function removeInteractionListeners() {
  ['pointerdown','touchstart','click','scroll'].forEach(evt => document.removeEventListener(evt, unlockAndPlay));
}
['pointerdown','touchstart','click','scroll'].forEach(evt => {
  document.addEventListener(evt, unlockAndPlay, { passive: true });
});
window.addEventListener('DOMContentLoaded', tryAutoplay);

/* ============ Fast CDN rewrite ============ */
function fastCDN(url){
  if (!url) return url;
  const m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
  if (!m) return url;
  const [, user, repo, branch, path] = m;
  return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
shuffle(SCRIPTS);

const dotColors = ['#fcd353', '#5cb85c', '#f04e44'];
const $ = id => document.getElementById(id);
let cat = 'Tất Cả';
let currentPage = 1;
const ITEMS_PER_PAGE = 20;
const cats = ['Tất Cả', 'Steal An Egg', 'Tất Cả Script Khủng Long'];

/* ============ Fast image pipeline ============ */
let imgObserver;
if (typeof IntersectionObserver !== 'undefined') {
  imgObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
      imgObserver.unobserve(img);
    }
  }, { rootMargin: '600px 0px', threshold: 0.01 });
} else {
  imgObserver = {
    observe: (img) => {
      const url = img.dataset.src;
      if (url && !img.src) {
        img.src = url;
        img.onload = () => {
          img.classList.add('img-ready');
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
        img.onerror = () => {
          const box = img.closest('.card-img-box');
          if (box) box.classList.add('loaded');
        };
      }
    },
    unobserve: () => {}
  };
}

function primeFirstImages(count = 6) {
  const imgs = [...document.querySelectorAll('.card-img-box img[data-src]')].slice(0, count);
  imgs.forEach(img => {
    const url = img.dataset.src;
    if (!url) return;
    img.src = url;
    img.onload = () => {
      img.classList.add('img-ready');
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    img.onerror = () => {
      const box = img.closest('.card-img-box');
      if (box) box.classList.add('loaded');
    };
    imgObserver.unobserve(img);
  });
}

/* ============ Render ============ */
function render(){
  const q = $('q').value.trim().toLowerCase();

  const filtered = SCRIPTS.filter(s =>
    (cat === 'Tất Cả' || s.c === cat) &&
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);

  // Cập nhật Sidebar (Danh mục)
  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      <span class="dot" style="background:${dotColors[i % dotColors.length]}"></span>
      <span>${c}</span>
    </button>
  `).join('');

  // Cập nhật Grid (Thẻ script)
  $('list').innerHTML = paginated.map(s => `
    <div class="card">
      <!-- Thêm thanh tiêu đề giống ảnh game -->
      <div class="card-header-title">
        <span style="color: var(--btn-yellow); -webkit-text-stroke: 1px var(--window-border);">★</span> ${s.c}
      </div>
      <div class="card-img-box">
        ${s.img
          ? `<img data-src="${fastCDN(s.img)}" alt="${s.hub}" decoding="async" width="640" height="360">`
          : `<div class="card-img-placeholder">SCRIPT IMAGE</div>`}
      </div>
      <div class="card-body">
        <h2 class="card-title">
          ${s.hub} ${s.game ? `<span class="game-name">${s.game}</span>` : ''}
        </h2>
        <div class="card-footer">
          <a class="btn-link" href="${s.link}" target="_blank" rel="noopener">LINK CHÍNH</a>
          <a class="btn-link btn-sub" href="${s.subLink}" target="_blank" rel="noopener">LINK PHỤ</a>
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.card-img-box img[data-src]').forEach(img => imgObserver.observe(img));
  primeFirstImages(6);

  // Phân trang
  let pageButtons = '';
  if (totalPages > 1) {
    pageButtons += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">&larr; Trước</button>`;
    for (let p = 1; p <= totalPages; p++) {
      pageButtons += `<button class="${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
    }
    pageButtons += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Sau &rarr;</button>`;
  }
  $('pagination').innerHTML = pageButtons;
}

function changeCat(c) { cat = c; currentPage = 1; render(); }
function changePage(p) { currentPage = p; render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

/* ===== TÌM KIẾM ===== */
$('q').addEventListener('input', () => {
  if ($('q').value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
});
$('go').addEventListener('click', () => {
  if ($('q').value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  render();
});

render();
</script>
