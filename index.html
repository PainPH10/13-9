<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pain Script</title>

<style>
:root {
  --bg-gradient: linear-gradient(180deg, #fce7f3 0%, #fbcfe8 50%, #fdf2f8 100%);
  --pink-bright: #ec4899;
  --pink-glow: #f43f5e;
  --card-bg: #ffffff;
  --text-main: #831843;
  --text-sub: #9d174d;
  --radius: 18px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-gradient) fixed;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

.header-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px 10px 20px;
}

.avatar-wrapper {
  position: relative;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  box-shadow: 0 0 35px rgba(236, 72, 153, 0.5), 0 0 15px rgba(244, 63, 94, 0.3);
  padding: 4px;
  margin-bottom: 12px;
  transition: transform 0.3s ease;
}

.avatar-wrapper.playing {
  animation: musicPulse 1.2s infinite alternate ease-in-out;
}

@keyframes musicPulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 25px rgba(236, 72, 153, 0.4);
  }
  100% {
    transform: scale(1.08);
    box-shadow: 0 0 50px rgba(244, 63, 94, 0.8);
  }
}

.avatar-wrapper::after {
  content: '';
  position: absolute;
  top: -6px; left: -6px; right: -6px; bottom: -6px;
  border-radius: 50%;
  border: 2px solid rgba(236, 72, 153, 0.4);
  box-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
}

.avatar-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.profile-name {
  font-size: 22px;
  font-weight: 800;
  color: #831843;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

.audio-player-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #ffffff;
  border: 2px solid #f472b6;
  border-radius: 30px;
  padding: 8px 18px;
  width: 100%;
  max-width: 320px;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px rgba(236, 72, 153, 0.2);
  user-select: none;
}

.play-icon-badge {
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: white;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
}

.audio-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  margin: 0 12px;
}

.audio-title {
  font-size: 12px;
  font-weight: 700;
  color: #831843;
}

.audio-sub {
  font-size: 10px;
  color: #be185d;
  font-weight: 600;
}

.equalizer {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 18px;
}

.eq-bar {
  width: 3px;
  background: #ec4899;
  border-radius: 3px;
  height: 4px;
}

.playing .eq-bar {
  animation: wave 0.8s infinite ease-in-out alternate;
}

.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
.playing .eq-bar:nth-child(4) { animation-delay: 0.4s; }

@keyframes wave {
  0% { height: 4px; }
  100% { height: 18px; }
}

.yt-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(135deg, #ff0000, #cc0000);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 13px;

main {

}

.hero-title {

.hero-sub {

  letter-spacing: 0.5px;
  margin-bottom: 24px;

.search-box {

  display: flex;
  align-items: center;

.search-box input {

  font-size: 14px;
  color: #831843;

}

.search-box input::placeholder {

}

.search-box button {

  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 13px;

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;

.tags button {
  white-space: nowrap;
  background: #ffffff;

  font-family: inherit;

  align-items: center;
  gap: 8px;

.tags button.on {

  border-color: #ec4899;
}

.tags button span.dot {

  border: 1.5px solid #ffffff;
}

.grid {

  grid-template-columns: repeat(2, 1fr);
  gap: 12px;

.card {
  background: var(--card-bg);

  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(236, 72, 153, 0.08);

.card-img-box {

  align-items: center;
  justify-content: center;
  overflow: hidden;

.card-img-box img {

  height: 100%;

.card-body {

.card-title {

.game-name {

.card-footer {

  justify-content: flex-start;

  text-decoration: none;
  font-weight: 700;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;

</style>

// Web Audio API Synthesizer - Guarantees Immediate Autoplay without user gesture
function startSynthAutoplay() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
    
    // Notes frequencies sequence (Lo-Fi melody loop)
    const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    let step = 0;

    setInterval(() => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.value = notes[step % notes.length];
      
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
      step++;
    }, 250);

    // Try playing HTML audio file as well
    audio.play().catch(() => {});
  } catch(e) {}
}

window.addEventListener('load', startSynthAutoplay);

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
shuffle(SCRIPTS);

const dotColors = ['#ff0055', '#7000ff', '#00d4ff', '#ffaa00'];
const $=id=>document.getElementById(id);
let cat='Tất Cả';
const cats=['Tất Cả', 'Steal An Egg', 'Ride A Pet', 'Tất Cả Script Khủng Long'];

function render(){
  const q = $('q').value.trim().toLowerCase();
  
  const filtered = SCRIPTS.filter(s => 
    (cat === 'Tất Cả' || s.c === cat) && 
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      <span class="dot" style="background:${dotColors[i % dotColors.length]}"></span>
      ${c}
    </button>
  `).join('');

  $('list').innerHTML = filtered.map(s => `
    <div class="card">
      <div class="card-img-box">
        ${s.img ? `<img src="${s.img}" alt="${s.hub}">` : `<div class="card-img-placeholder">SCRIPT ${s.c.toUpperCase()}</div>`}

  `).join('');
}

function changeCat(c) {

  render();
}
