<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1226">
<title>Pain Script</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://i.ibb.co" crossorigin>
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1226;
  --bg-2:#151a35;
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12);
  --text:#f2f4ff;
  --text-2:#aab0d0;
  --text-3:#737aa0;
  --amber:#ffc533;
  --amber-ink:#2a1c00;
  --violet:#7c6cff;
  --pink:#ff5fa2;
  --green:#3ddc97;
  --r-lg:22px;
  --r-md:14px;
  --r-pill:999px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 calc(48px + env(safe-area-inset-bottom,0px));
  position:relative;overflow-x:hidden;
}
/* nền aurora */
body::before,body::after{
  content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none;
}
body::before{width:520px;height:520px;left:-160px;top:-140px;background:radial-gradient(circle,#5b4bff,transparent 70%)}
body::after{width:480px;height:480px;right:-140px;top:260px;background:radial-gradient(circle,#ff5fa2 0%,transparent 70%);opacity:.32}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ===== Header ===== */
.top{
  max-width:1100px;margin:0 auto;padding:44px 20px 8px;
  display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
}
.support{
  position:absolute;top:14px;right:16px;width:92px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.support img{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-md);
  border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff;
}
.support span{
  font-size:11px;font-weight:700;line-height:1.2;color:#fff;
  background:linear-gradient(135deg,var(--pink),#ff7a59);
  padding:4px 9px;border-radius:var(--r-pill);white-space:nowrap;
  box-shadow:0 6px 16px rgba(255,95,162,.35);
}
.avatar{
  width:104px;height:104px;border-radius:50%;padding:3px;margin-bottom:14px;
  background:conic-gradient(from 180deg,var(--amber),var(--pink),var(--violet),var(--amber));
  transition:transform .3s;
}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block}
.avatar.playing{animation:spin-glow 6s linear infinite}
@keyframes spin-glow{to{filter:hue-rotate(360deg)}}
.name{
  margin:0 0 18px;font-size:30px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,#fff,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent;
}

.player{
  display:flex;align-items:center;gap:12px;width:100%;max-width:340px;
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:8px 18px 8px 8px;color:var(--text);cursor:pointer;text-align:left;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:background .2s,transform .15s;
}
.player:hover{background:var(--glass-2)}
.player:active{transform:scale(.98)}
.play-btn{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;font-size:14px;
  background:var(--amber);color:var(--amber-ink);
  box-shadow:0 6px 16px rgba(255,197,51,.35);
}
.player-info{flex:1;min-width:0;display:flex;flex-direction:column}
.player-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:11.5px;color:var(--text-2)}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;height:4px;border-radius:2px;background:var(--green)}
.player.playing .eq i{animation:wave .8s ease-in-out infinite alternate}
.player.playing .eq i:nth-child(2){animation-delay:.25s}
.player.playing .eq i:nth-child(3){animation-delay:.1s}
.player.playing .eq i:nth-child(4){animation-delay:.4s}
@keyframes wave{to{height:18px}}

.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin:14px 0 6px}
.social a{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 12px;border-radius:var(--r-pill);font-weight:600;font-size:13.5px;color:#fff;
  border:1px solid var(--line);transition:transform .15s,filter .2s;
}
.social a:hover{filter:brightness(1.12)}
.social a:active{transform:scale(.97)}
.yt{background:linear-gradient(135deg,#ff2d3d,#c4101f)}
.tt{background:linear-gradient(135deg,#1c1f3a,#0a0c1c)}

/* ===== Main ===== */
main{max-width:1100px;margin:0 auto;padding:18px 16px 0}
.notice{
  max-width:720px;margin:0 auto 22px;padding:16px 18px;text-align:center;
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.notice h1{margin:0 0 6px;font-size:clamp(16px,3.6vw,21px);line-height:1.4;font-weight:700;letter-spacing:-.01em}
.notice p{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.6}

.search-wrap{position:relative;max-width:720px;margin:0 auto 18px;z-index:30}
.search{
  display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;
  background:rgba(20,25,52,.85);border:1px solid var(--line);border-radius:var(--r-pill);
  box-shadow:0 14px 40px rgba(0,0,0,.35);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:border-color .2s,box-shadow .2s;
}
.search:focus-within{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,197,51,.15),0 14px 40px rgba(0,0,0,.35)}
.search svg{flex:0 0 auto;color:var(--text-3)}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);
  font-family:inherit;font-size:15px;padding:10px 0;
}
.search input::placeholder{color:var(--text-3)}
.search button{
  border:0;cursor:pointer;font-weight:700;font-size:14px;color:var(--amber-ink);
  background:var(--amber);padding:11px 22px;border-radius:var(--r-pill);transition:transform .15s,filter .2s;
}
.search button:hover{filter:brightness(1.07)}
.search button:active{transform:scale(.96)}

.suggestions{
  position:absolute;left:0;right:0;top:calc(100% + 8px);display:none;
  max-height:300px;overflow-y:auto;padding:6px;
  background:rgba(21,26,53,.97);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.suggestions.show{display:block}
.sug-item{padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--text)}
.sug-item:hover,.sug-item.active{background:rgba(255,197,51,.16);color:var(--amber)}
.sug-empty{padding:14px;text-align:center;color:var(--text-3);font-size:13px}

.tags{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:8px;
  scrollbar-width:none;
}
.tags::-webkit-scrollbar{display:none}
.tags button{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:var(--r-pill);cursor:pointer;
  font-size:13px;font-weight:600;color:var(--text-2);
  background:var(--glass);border:1px solid var(--line);
  transition:background .2s,color .2s,border-color .2s,transform .15s;
}
.tags button:hover{background:var(--glass-2);color:var(--text)}
.tags button:active{transform:scale(.96)}
.tags button.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.tags .dot{width:8px;height:8px;border-radius:50%}

.result-info{margin:0 2px 14px;color:var(--text-3);font-size:13px}

/* ===== Cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.card:hover{transform:translateY(-4px);border-color:rgba(255,197,51,.5);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-2)}
.thumb::before{
  content:"";position:absolute;inset:0;z-index:1;transition:opacity .35s;
  background:linear-gradient(90deg,#1a2042 25%,#262d5c 50%,#1a2042 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;
}
.thumb.loaded::before{opacity:0;pointer-events:none}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.thumb img{
  position:relative;z-index:2;width:100%;height:100%;object-fit:cover;object-position:top center;
  opacity:0;transition:opacity .35s,transform .5s;
}
.thumb img.img-ready{opacity:1}
.card:hover .thumb img{transform:scale(1.05)}
.thumb::after{
  content:"";position:absolute;inset:auto 0 0 0;height:45%;z-index:3;pointer-events:none;
  background:linear-gradient(to top,rgba(14,18,38,.7),transparent);
}
.placeholder{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:0 10px;text-align:center;font-weight:700;font-size:13px;color:var(--text-2)}

.body{display:flex;flex-direction:column;flex:1;padding:14px 14px 14px}
.hub{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.game{
  display:inline-block;align-self:flex-start;margin-top:8px;
  font-size:12.5px;font-weight:600;line-height:1.3;color:#ffd7e8;
  background:rgba(255,95,162,.16);border:1px solid rgba(255,95,162,.35);
  padding:4px 10px;border-radius:var(--r-pill);
}
.actions{margin-top:auto;padding-top:14px;display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;
  padding:10px 8px;border-radius:12px;font-size:13px;font-weight:700;
  transition:transform .15s,filter .2s,background .2s;
}
.btn:active{transform:scale(.96)}
.btn-main{background:linear-gradient(135deg,var(--amber),#ffa62b);color:var(--amber-ink);box-shadow:0 6px 16px rgba(255,166,43,.25)}
.btn-main:hover{filter:brightness(1.08)}
.btn-sub{background:var(--glass-2);border:1px solid var(--line);color:var(--text)}
.btn-sub:hover{background:rgba(255,255,255,.15)}

.empty{
  grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--text-2);
  background:var(--glass);border:1px dashed var(--line);border-radius:var(--r-lg);
}
.empty strong{display:block;font-size:17px;color:var(--text);margin-bottom:6px}

/* ===== Pagination ===== */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:32px}
.pagination button{
  min-width:40px;height:40px;padding:0 14px;border-radius:12px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--text);
  background:var(--glass);border:1px solid var(--line);transition:background .2s,transform .15s;
}
.pagination button:hover:not(:disabled){background:var(--glass-2)}
.pagination button:active:not(:disabled){transform:scale(.95)}
.pagination button.active{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.pagination button:disabled{opacity:.35;cursor:not-allowed}

@media (max-width:560px){
  .top{padding-top:36px}
  .support{width:70px;top:10px;right:10px}
  .support span{font-size:9.5px;padding:3px 7px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .body{padding:10px}
  .hub{font-size:15px}
  .game{font-size:11px;padding:3px 8px}
  .actions{grid-template-columns:1fr;gap:6px}
  .btn{padding:9px 6px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<script>
/* ============ Audio ============ */
const audio = document.getElementById('bgAudio');
const avatarFrame = document.getElementById('avatarFrame');
const playerWidget = document.getElementById('playerWidget');
const audioStatus = document.getElementById('audioStatus');
const iconBadge = document.getElementById('iconBadge');
let isPlaying = false;
let userPaused = false;

function activateAudioUI() {
  isPlaying = true; userPaused = false;
  avatarFrame.classList.add('playing');
  playerWidget.classList.add('playing');
  iconBadge.innerText = '♫';
  audioStatus.innerText = 'Đang phát • Chạm để tắt';
}
function deactivateAudioUI() {
  isPlaying = false; userPaused = true;
  avatarFrame.classList.remove('playing');
  playerWidget.classList.remove('playing');
  iconBadge.innerText = '▶';
  audioStatus.innerText = 'Nhạc đã tắt • Chạm để bật';
}
function tryAutoplay() {
  if (userPaused) return;
  audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); })
    .catch(() => { audioStatus.innerText = 'Chạm để bật nhạc'; });
}
function unlockAndPlay() {
  if (userPaused || isPlaying) return;
  audio.play().then(() => { activateAudioUI(); removeInteractionListeners(); }).catch(() => {});
}
function manualPlayTrigger() {
  if (audio.paused) audio.play().then(activateAudioUI).catch(() => {});
  else { audio.pause(); deactivateAudioUI(); }
}
function removeInteractionListeners() {
  ['pointerdown','touchstart','click','scroll'].forEach(evt => document.removeEventListener(evt, unlockAndPlay));
}
['pointerdown','touchstart','click','scroll'].forEach(evt => document.addEventListener(evt, unlockAndPlay, { passive: true }));
window.addEventListener('DOMContentLoaded', () => setTimeout(tryAutoplay, 2000));

/* ============ Fast CDN rewrite ============ */
function fastCDN(url){
  if (!url) return url;
  const m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/(.+)$/);
  if (m) {
    const [, user, repo, rest] = m;
    let branch, path;
    if (rest.startsWith('refs/heads/')) {
      const after = rest.slice(11), s = after.indexOf('/');
      if (s !== -1) { branch = after.slice(0, s); path = after.slice(s + 1); }
    } else {
      const s = rest.indexOf('/');
      if (s !== -1) { branch = rest.slice(0, s); path = rest.slice(s + 1); }
    }
    if (branch && path) return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
    return url;
  }
  if (/^https:\/\/i\.ibb\.co\//.test(url)) return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=640&output=webp&q=75`;
  return url;
}

/* ============ Data ============ */
const SCRIPTS = [
  {id: 1, hub:"Nox Hub", game:"Vox Seas", c:"Tất Cả", link:"https://link4m.net/l9d3zHVM", subLink:"https://link4m.org/2dD0D", img:"https://i.ibb.co/PnHyb1S/IMG-6392.jpg"},
  {id: 2, hub:"Rift", game:"Climb For Animals Eggs", c:"Tất Cả", link:"https://link4m.net/esiNRzQm", subLink:"https://link4m.org/aM3vs5", img:"https://i.ibb.co/2Y8wSqpK/IMG-5037.jpg"},
  {id: 3, hub:"N-Hook", game:"Solve The Cube", c:"Tất Cả", link:"https://link4m.net/8oqCO5sN", subLink:"https://link4m.org/fU173sY", img:"https://i.ibb.co/VpMX4kjS/IMG-5068.jpg"},
  {id: 4, hub:"R Hub", game:"Ride A Pet", c:"Tất Cả", link:"https://link4m.net/Un5BcNem", subLink:"https://link4m.org/V6yRgx", img:"https://raw.githubusercontent.com/PainPH10/13-9/refs/heads/main/IMG_4155.jpeg"},
  {id: 5, hub:"Sell Lemons", game:"", c:"Tất Cả", link:"https://link4m.org/z3UoA", subLink:"https://link4m.org/ig7XmH", img:"https://i.ibb.co/23gMZnfC/IMG-5049.jpg"},
  {id: 6, hub:"Furmix Hub", game:"Bike For Egg", c:"Tất Cả", link:"https://link4m.net/uVa6MWY6", subLink:"https://link4m.org/5Ovxh", img:"https://i.ibb.co/wN6hS8hn/8-D6-ED3-EA-E99-B-405-F-BFC9-0-EC1-EF5-AA4-D2.jpg"},
  {id: 7, hub:"Dek Dev Hub", game:"Break And Steal An Egg", c:"Tất Cả", link:"https://link4m.net/xgzeS", subLink:"https://link4m.org/oHTRXhim", img:"https://i.ibb.co/vCSbzGnf/IMG-5518.jpg"},

  {id: 102, hub:"Mystrix", game:"Driving Empire", c:"Tất Cả", link:"https://link4m.net/sTUtm", subLink:"https://link4m.org/63vtiX2p", img:"https://i.ibb.co/qLnqnD5n/IMG-6315.jpg"},
  {id: 103, hub:"Multi Hub", game:"Ant Evolution", c:"Tất Cả", link:"https://link4m.net/bl5dv4", subLink:"https://link4m.net/itrCk", img:"https://i.ibb.co/DPgbgh55/IMG-6330.jpg"},
  {id: 104, hub:"One Hub", game:"King Legacy", c:"King Legacy", link:"https://link4m.org/dcfp4Z79", subLink:"https://link4m.net/sI4qpjp", img:"https://i.ibb.co/PGmgQD84/IMG-6352.jpg"},
  {id: 105, hub:"Mystrix", game:"Ragdoll Soccer", c:"Tất Cả", link:"https://link4m.org/iMDQ7uKb", subLink:"https://link4m.net/whiTi70Q", img:"https://i.ibb.co/wZc8RgF3/IMG-6382.jpg"},
  {id: 106, hub:"Kryzen Hub", game:"Attack On Titan Revolution", c:"Attack On Titan Revolution", link:"https://link4m.org/dNhqsdzo", subLink:"https://link4m.net/5TSDM1", img:"https://i.ibb.co/HL9mbFXR/IMG-6361.jpg"},
  {id: 107, hub:"Cryonix", game:"Attack On Titan Revolution", c:"Attack On Titan Revolution", link:"https://link4m.net/p9xBgX", subLink:"https://link4m.net/oWjnqFO9", img:"https://i.ibb.co/TqnCj1c7/IMG-5899.jpg"},
  {id: 108, hub:"Axon Hub", game:"Fisch", c:"Tất Cả Script Game Câu Cá", link:"https://link4m.net/xtveIKVc", subLink:"https://link4m.org/FocWbr", img:"https://i.ibb.co/VWJCyQMc/IMG-6422.jpg"}
];

function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
shuffle(SCRIPTS);

const dotColors = ['#ffc533', '#ff5fa2', '#7c6cff', '#3ddc97', '#38bdf8', '#ff7a59'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cat = 'Tất Cả';
let currentPage = 1;
const ITEMS_PER_PAGE = 20;
const cats = ['Tất Cả', 'Attack On Titan Revolution', 'King Legacy', 'Tất Cả Script Game Câu Cá', '99 Nights In The Forest', 'Throw Food For Animals'];

/* ============ Image loading ============ */
function bindImg(img){
  const box = img.closest('.thumb');
  img.onload = () => { img.classList.add('img-ready'); box && box.classList.add('loaded'); };
  img.onerror = () => { box && box.classList.add('loaded'); };
  img.src = img.dataset.src;
}
const imgObserver = ('IntersectionObserver' in window)
  ? new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const img = e.target;
        if (img.dataset.src && !img.src) bindImg(img);
        imgObserver.unobserve(img);
      });
    }, { rootMargin: '600px 0px', threshold: 0.01 })
  : { observe: img => { if (img.dataset.src && !img.src) bindImg(img); }, unobserve(){} };

function primeFirstImages(count = 4){
  [...document.querySelectorAll('.thumb img[data-src]')].slice(0, count).forEach(img => {
    img.fetchPriority = 'high';
    img.removeAttribute('loading');
    if (!img.src) bindImg(img);
    imgObserver.unobserve(img);
  });
}

/* ============ Render ============ */
function render(){
  const q = $('q').value.trim().toLowerCase();
  const filtered = SCRIPTS.filter(s =>
    (cat === 'Tất Cả' || s.c === cat) &&
    (!q || s.hub.toLowerCase().includes(q) || s.game.toLowerCase().includes(q))
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);

  $('tags').innerHTML = cats.map((c, i) => `
    <button class="${c === cat ? 'on' : ''}" onclick="changeCat('${c}')">
      <span class="dot" style="background:${dotColors[i % dotColors.length]}"></span>${esc(c)}
    </button>`).join('');

  $('resultInfo').textContent = filtered.length ? `${filtered.length} script` : '';

  $('list').innerHTML = paginated.length ? paginated.map(s => `
    <article class="card">
      <div class="thumb">
        ${s.img
          ? `<img data-src="${fastCDN(s.img)}" alt="${esc(s.hub)}" decoding="async" loading="lazy" fetchpriority="low" width="640" height="360">`
          : `<div class="placeholder">${esc(s.c)}</div>`}
      </div>
      <div class="body">
        <h3 class="hub">${esc(s.hub)}</h3>
        ${s.game ? `<span class="game">${esc(s.game)}</span>` : ''}
        <div class="actions">
          <a class="btn btn-main" href="${s.link}" target="_blank" rel="noopener">Link chính</a>
          <a class="btn btn-sub" href="${s.subLink}" target="_blank" rel="noopener">Link phụ</a>
        </div>
      </div>
    </article>`).join('')
    : `<div class="empty"><strong>Không tìm thấy script nào</strong>Thử gõ tên game bằng tiếng Anh hoặc chọn danh mục khác.</div>`;

  document.querySelectorAll('.thumb img[data-src]').forEach(img => imgObserver.observe(img));
  primeFirstImages(4);

  let pb = '';
  if (totalPages > 1) {
    pb += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})" aria-label="Trang trước">&larr;</button>`;
    for (let p = 1; p <= totalPages; p++) pb += `<button class="${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`;
    pb += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})" aria-label="Trang sau">&rarr;</button>`;
  }
  $('pagination').innerHTML = pb;
}

function changeCat(c){ cat = c; currentPage = 1; render(); hideSuggestions(); }
function changePage(p){ currentPage = p; render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

/* ============ Suggestions ============ */
const inputEl = $('q');
const sugBox = $('suggestions');
let sugItems = [], sugActiveIdx = -1;

function hideSuggestions(){ sugBox.classList.remove('show'); sugBox.innerHTML = ''; sugItems = []; sugActiveIdx = -1; }

function showSuggestions(query){
  const q = query.trim().toLowerCase();
  if (!q) { hideSuggestions(); return; }
  const games = new Set(), hubs = new Set();
  SCRIPTS.forEach(s => {
    if (s.game && s.game.toLowerCase().includes(q)) games.add(s.game);
    if (s.hub && s.hub.toLowerCase().includes(q)) hubs.add(s.hub);
  });
  sugItems = [...[...games].slice(0, 6), ...[...hubs].slice(0, 6)].map(label => ({ label }));
  sugActiveIdx = -1;

  if (!sugItems.length) {
    sugBox.innerHTML = `<div class="sug-empty">Không có gợi ý, thử từ khóa khác</div>`;
  } else {
    sugBox.innerHTML = sugItems.map((it, i) => `<div class="sug-item" role="option" data-idx="${i}">${esc(it.label)}</div>`).join('');
    sugBox.querySelectorAll('.sug-item').forEach(el => el.addEventListener('click', () => pickSuggestion(Number(el.dataset.idx))));
  }
  sugBox.classList.add('show');
}

function pickSuggestion(idx){
  const it = sugItems[idx];
  if (!it) return;
  inputEl.value = it.label;
  cat = 'Tất Cả'; currentPage = 1;
  render(); hideSuggestions(); inputEl.blur();
}

function highlightSuggestion(i){
  const nodes = sugBox.querySelectorAll('.sug-item');
  if (!nodes.length) return;
  sugActiveIdx = (i + nodes.length) % nodes.length;
  nodes.forEach((n, k) => n.classList.toggle('active', k === sugActiveIdx));
  nodes[sugActiveIdx].scrollIntoView({ block: 'nearest' });
}

let renderTimeout;
inputEl.addEventListener('input', () => {
  if (inputEl.value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1;
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(render, 150);
  showSuggestions(inputEl.value);
});

inputEl.addEventListener('keydown', e => {
  if (!sugBox.classList.contains('show')) {
    if (e.key === 'Enter' && inputEl.value.trim() !== '') { cat = 'Tất Cả'; currentPage = 1; render(); }
    return;
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); highlightSuggestion(sugActiveIdx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); highlightSuggestion(sugActiveIdx - 1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (sugActiveIdx >= 0) pickSuggestion(sugActiveIdx);
    else { if (inputEl.value.trim() !== '') { cat = 'Tất Cả'; currentPage = 1; render(); } hideSuggestions(); }
  } else if (e.key === 'Escape') hideSuggestions();
});

$('go').addEventListener('click', () => {
  if (inputEl.value.trim() !== '') cat = 'Tất Cả';
  currentPage = 1; render(); hideSuggestions();
});
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) hideSuggestions(); });

render();
</script>
