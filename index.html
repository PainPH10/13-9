<script>
    // Hàm tính key tự động đổi theo ngày hôm nay (14/10/2026 -> 0painph_14102026)
    function getDailyKey() {
        const date = new Date();
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `0painph_${d}${m}${y}`;
    }

    document.getElementById('userKey').innerText = getDailyKey();

    function goToLink4M() {
        // Gắn link Link4M của boss man vào đây
        window.location.href = "https://link4m.net/MfDoh"; 
    }

    // Kiểm tra khi người chơi vượt link xong quay lại
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('completed') === 'true' || urlParams.has('k') || document.referrer.includes('link4m')) {
        document.getElementById('getLinkBtn').style.display = 'none';
        document.getElementById('keySection').style.display = 'block';
    }

    function copyKey() {
        const keyText = document.getElementById('userKey').innerText;
        navigator.clipboard.writeText(keyText);
        alert("Đã sao chép key thành công, vào game dán vào bảng Rayfield thôi boss man!");
    }
</script>
